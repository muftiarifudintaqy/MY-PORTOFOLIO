<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commit Snake · Mufti Arifudin Taqy</title>
<meta name="description" content="Play Commit Snake: eat commits, grow one block per bite, don't hit the wall or your own tail.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
:root{--bg:#050507;--card:#0D0D12;--line:#24242C;--ink:#F5F5F7;--sub:#8E8E99;--dim:#55555F;--a:#5E5CE6;--b:#BF5AF2;--c:#FF6482;
--mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));gap:16px}
a{color:var(--sub);text-decoration:none}a:hover{color:var(--ink)}
.top{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:center;font:12px var(--mono)}
.win{width:100%;max-width:880px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--sub)}
.dot{width:9px;height:9px;border-radius:50%}
.bar .r{margin-left:auto}
.hud{display:flex;gap:28px;padding:16px 20px 4px;font:11px var(--mono);color:var(--sub);letter-spacing:.08em}
.hud b{display:block;font:700 26px var(--sans);color:var(--ink);letter-spacing:-.02em;margin-top:4px}
.stage{position:relative;padding:12px 20px 20px}
canvas{display:block;width:100%;height:auto;border-radius:10px;background:#0A0A0F;touch-action:none}
.overlay{position:absolute;inset:12px 20px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:10px;background:rgba(5,5,7,.78);backdrop-filter:blur(4px);text-align:center;padding:20px}
.overlay[hidden]{display:none}
.overlay h1{font-size:clamp(26px,5vw,40px);letter-spacing:-.03em;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay p{color:var(--sub);font-size:14px;max-width:420px;line-height:1.5}
button{font:600 14px var(--sans);color:#050507;background:var(--ink);border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
button:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center}
.pad button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0;font-size:20px}
.pad .up{grid-column:2}.pad .lf{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .rt{grid-column:3;grid-row:2}
.help{font:11px var(--mono);color:var(--dim);text-align:center}
@media (hover:none){.pad{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><a href="./">← muftzyxslwly.my.id</a><a href="https://github.com/muftiarifudintaqy" target="_blank" rel="noopener noreferrer">github ↗</a></div>
<section class="win" aria-label="Commit Snake game">
  <div class="bar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span><span>~/activity --play snake</span><span class="r">mufti@montera</span></div>
  <div class="hud">
    <div>LENGTH<b id="len">3</b></div>
    <div>COMMITS EATEN<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>
  <div class="stage">
    <canvas id="c" width="1680" height="560" aria-label="Game board"></canvas>
    <div class="overlay" id="ov">
      <h1 id="ovTitle">Commit Snake</h1>
      <p id="ovText">Eat every commit. Each bite adds one block. Hit the wall or your own tail and it starts over.</p>
      <button id="go">Play</button>
    </div>
  </div>
</section>
<div class="pad" aria-label="Touch controls">
  <button class="up" data-d="up" aria-label="Up">↑</button><button class="lf" data-d="left" aria-label="Left">←</button><button class="dn" data-d="down" aria-label="Down">↓</button><button class="rt" data-d="right" aria-label="Right">→</button>
</div>
<p class="help">Arrow keys or WASD · swipe on mobile · Space to pause</p>

<script>
(() => {
  const COLS = 30, ROWS = 10, cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const S = cv.width / COLS; // cell size in canvas px
  const ui = { len: document.getElementById('len'), score: document.getElementById('score'), best: document.getElementById('best'),
               ov: document.getElementById('ov'), t: document.getElementById('ovTitle'), x: document.getElementById('ovText'), go: document.getElementById('go') };
  const STOPS = [[94,92,230],[191,90,242],[255,100,130]];
  const mix = t => { const s = t < .5 ? 0 : 1, k = t < .5 ? t / .5 : (t - .5) / .5, a = STOPS[s], b = STOPS[s+1]; return a.map((v,i)=>Math.round(v+(b[i]-v)*k)); };
  const rgb = (c, f = 1) => `rgb(${c.map(v=>Math.max(0,Math.min(255,Math.round(v*f)))).join(',')})`;
  let best = 0; try { best = +localStorage.getItem('commitSnakeBest') || 0; } catch (e) {}
  ui.best.textContent = best;

  let snake, dir, nextDir, food, eaten, running = false, paused = false, last = 0, acc = 0, step = 120, dying = 0;
  const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

  function spawnSnake() { // start from a random wall, facing inward
    const side = Math.floor(Math.random() * 4); let h, d;
    if (side === 0) { h = [1, 1 + Math.floor(Math.random() * (ROWS - 2))]; d = 'right'; }
    else if (side === 1) { h = [COLS - 2, 1 + Math.floor(Math.random() * (ROWS - 2))]; d = 'left'; }
    else if (side === 2) { h = [3 + Math.floor(Math.random() * (COLS - 6)), 1]; d = 'down'; }
    else { h = [3 + Math.floor(Math.random() * (COLS - 6)), ROWS - 2]; d = 'up'; }
    const [dx, dy] = DIRS[d];
    snake = [h, [h[0]-dx, h[1]-dy], [h[0]-2*dx, h[1]-2*dy]].map(p => [Math.max(0,Math.min(COLS-1,p[0])), Math.max(0,Math.min(ROWS-1,p[1]))]);
    dir = nextDir = d;
  }
  function placeFood() {
    const taken = new Set(snake.map(p => p.join(',')));
    let p; do { p = [Math.floor(Math.random()*COLS), Math.floor(Math.random()*ROWS)]; } while (taken.has(p.join(',')));
    food = { p, t: performance.now(), lvl: Math.random() };
  }
  function start() {
    spawnSnake(); eaten = 0; step = 120; placeFood(); dying = 0;
    running = true; paused = false; ui.ov.hidden = true; hud(); last = performance.now(); acc = 0;
  }
  function hud() { ui.len.textContent = snake.length; ui.score.textContent = eaten; ui.best.textContent = best; }
  function over(reason) {
    running = false; dying = performance.now();
    if (eaten > best) { best = eaten; try { localStorage.setItem('commitSnakeBest', best); } catch (e) {} }
    hud();
    setTimeout(() => {
      ui.t.textContent = 'Game over';
      ui.x.textContent = `${reason}. You ate ${eaten} commit${eaten === 1 ? '' : 's'} and grew to ${snake.length} blocks.`;
      ui.go.textContent = 'Play again'; ui.ov.hidden = false; ui.go.focus();
    }, 700);
  }
  function tick() {
    const opposite = { up:'down', down:'up', left:'right', right:'left' };
    if (nextDir !== opposite[dir]) dir = nextDir;
    const [dx, dy] = DIRS[dir], h = snake[0], n = [h[0]+dx, h[1]+dy];
    if (n[0] < 0 || n[1] < 0 || n[0] >= COLS || n[1] >= ROWS) return over('You hit the wall');
    const grow = n[0] === food.p[0] && n[1] === food.p[1];
    const body = grow ? snake : snake.slice(0, -1);
    if (body.some(p => p[0] === n[0] && p[1] === n[1])) return over('You bit your own tail');
    snake.unshift(n);
    if (grow) { eaten++; step = Math.max(65, 120 - eaten * 2.2); placeFood(); } else snake.pop();
    hud();
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function drawBoard(now) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) { ctx.fillStyle = '#15151C'; rr(x*S+5, y*S+5, S-10, S-10, 8); ctx.fill(); }
    // food: a pulsing commit square
    const pulse = 1 + Math.sin(now / 180) * 0.08, c = mix(food.lvl);
    const fx = food.p[0]*S + S/2, fy = food.p[1]*S + S/2, fs = (S-14) * pulse;
    ctx.shadowColor = rgb(c); ctx.shadowBlur = 24; ctx.fillStyle = rgb(c); rr(fx-fs/2, fy-fs/2, fs, fs, 9); ctx.fill(); ctx.shadowBlur = 0;
  }
  function drawSnake(now, alpha) {
    const n = snake.length;
    ctx.globalAlpha = alpha;
    for (let i = n - 1; i >= 1; i--) { // body with scales, head drawn last
      const [x, y] = snake[i], cx = x*S + S/2, cy = y*S + S/2, t = i / Math.max(8, n);
      const r = (S * 0.43) * (0.72 + 0.28 * (1 - t)), col = mix(Math.min(1, t));
      const prev = snake[i-1], ang = Math.atan2(prev[1]-y, prev[0]-x);
      // bridge to previous segment so the body looks continuous
      ctx.strokeStyle = rgb(col); ctx.lineWidth = r * 1.7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(prev[0]*S + S/2, prev[1]*S + S/2); ctx.stroke();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
      ctx.fillStyle = rgb(col); ctx.beginPath(); ctx.ellipse(0, 0, r*1.05, r, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = rgb(col, .6); ctx.lineWidth = 2;
      for (const k of [-.45, .1]) { ctx.beginPath(); ctx.arc(r*k - r*.2, 0, r*.62, -1.1, 1.1); ctx.stroke(); } // scales
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(0, -r*.4, r*.6, r*.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // head
    const [hx, hy] = snake[0], [dx, dy] = DIRS[dir], ang = Math.atan2(dy, dx);
    ctx.save(); ctx.translate(hx*S + S/2, hy*S + S/2); ctx.rotate(ang);
    const k = S / 26;
    if (Math.floor(now / 260) % 3 !== 0) { // tongue flick
      ctx.strokeStyle = '#FF453A'; ctx.lineWidth = 2.4*k; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(11*k, 0); ctx.lineTo(19*k, 0); ctx.lineTo(23*k, -3*k); ctx.moveTo(19*k, 0); ctx.lineTo(23*k, 3*k); ctx.stroke();
    }
    const g = ctx.createRadialGradient(5*k, 0, 1, 0, 0, 14*k); g.addColorStop(0, '#FF9BBA'); g.addColorStop(.6, '#FF6482'); g.addColorStop(1, '#C2306A');
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(-9*k, -9*k); ctx.bezierCurveTo(3*k, -11*k, 13*k, -6*k, 13.5*k, 0); ctx.bezierCurveTo(13*k, 6*k, 3*k, 11*k, -9*k, 9*k); ctx.bezierCurveTo(-12*k, 4*k, -12*k, -4*k, -9*k, -9*k); ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(4*k, s*5*k, 3.4*k, 2.8*k, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0A0A0F'; ctx.beginPath(); ctx.ellipse(5*k, s*5*k, 1.4*k, 2.2*k, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3a0d1c'; ctx.beginPath(); ctx.arc(11.5*k, s*1.8*k, .8*k, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function loop(now) {
    if (running && !paused) { acc += now - last; while (acc >= step && running) { acc -= step; tick(); } }
    last = now;
    drawBoard(now);
    if (snake) {
      let a = 1;
      if (dying) { const t = (now - dying) / 700; a = Math.max(.25, 1 - t); if (Math.floor((now - dying) / 90) % 2) a *= .4; }
      drawSnake(now, a);
    }
    if (paused) { ctx.fillStyle = 'rgba(5,5,7,.6)'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle = '#F5F5F7'; ctx.font = `700 ${S*.8}px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'center'; ctx.fillText('Paused', cv.width/2, cv.height/2 + S*.25); }
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  const keymap = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
  addEventListener('keydown', e => {
    if (keymap[e.key]) { e.preventDefault(); if (!running && ui.ov.hidden === false) return; nextDir = keymap[e.key]; }
    else if (e.key === ' ' && running) { e.preventDefault(); paused = !paused; }
    else if (e.key === 'Enter' && !running) start();
  });
  document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); if (!running) start(); nextDir = b.dataset.d; }));
  let sx = 0, sy = 0;
  cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  cv.addEventListener('pointerup', e => {
    const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    nextDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  });
  ui.go.addEventListener('click', start);
  spawnSnake(); placeFood(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
